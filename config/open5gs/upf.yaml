# Open5GS UPF config for pq-suci-5g (from v2.8.0 configs/open5gs/upf.yaml.in).
# @RUNTIME@ and @KEYS@ are replaced by scripts/start_core.sh.
logger:
  file:
    path: @RUNTIME@/log/upf.log
global:
  max:
    ue: 1024
upf:
  pfcp:
    server:
      - address: 127.0.0.7
    client:
  gtpu:
    server:
      - address: 127.0.0.7
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
    - subnet: 2001:db8:cafe::/48
      gateway: 2001:db8:cafe::1
  metrics:
    server:
      - address: 127.0.0.7
        port: 9090
